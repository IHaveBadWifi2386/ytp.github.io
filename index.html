<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal</title>
    <style>
        /* Smooth page entry slide */
        @keyframes slideUpPage {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Continuous moving background gradient wave */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Pulsing beacon glow for the active connection status */
        @keyframes statusPulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        /* Elastic snap animation for the widescreen box frame */
        @keyframes elasticReveal {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            70% { transform: scale(1.02) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        body {
            background: linear-gradient(-45deg, #0f0f11, #18181b, #111115, #09090b);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite, slideUpPage 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            color: #fff;
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 60px 20px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #a1a1aa;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            animation: statusPulse 2s infinite;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p {
            color: #71717a;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 600px;
            margin: 0 auto 50px auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: border-color 0.4s, box-shadow 0.4s, transform 0.3s;
        }

        .search-box:focus-within {
            border-color: rgba(204, 0, 0, 0.5);
            box-shadow: 0 0 25px rgba(204, 0, 0, 0.2);
            transform: scale(1.01);
        }

        input {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
        }

        input::placeholder {
            color: #52525b;
        }

        button {
            padding: 14px 32px;
            font-size: 15px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
        }

        button:hover {
            background: #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.4);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px) scale(0.98);
        }

        #box {
            display: none;
            max-width: 760px;
            margin: 40px auto 0 auto;
        }

        .elastic-reveal {
            display: block !important;
            animation: elasticReveal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
    </style>
</head>
<body>

    <div class="status-badge">
        <div class="status-dot"></div>
        Bypass Channel Secure
    </div>

    <h1>Video Gateway Pro</h1>
    <p>Input a YouTube path parameters or clean ID block directly</p>
    
    <div class="search-box">
        <input type="text" id="vid" placeholder="Paste link or video ID here...">
        <button onclick="play()">Launch Stream</button>
    </div>

    <div id="box">
        <div class="video-wrapper">
            <iframe id="frame" allowfullscreen></iframe>
        </div>
    </div>

    <script>
    function play() {
        var input = document.getElementById('vid').value.trim();
        if (!input) return;

        var id = input;
        if (input.includes('v=')) {
            id = input.split('v=')[1].split('&')[0];
        } else if (input.includes('youtu.be/')) {
            id = input.split('youtu.be/')[1].split('?')[0];
        } else if (input.includes('embed/')) {
            id = input.split('embed/')[1].split('?')[0];
        }

        var box = document.getElementById('box');
        var frame = document.getElementById('frame');

        box.classList.remove('elastic-reveal');
        void box.offsetWidth; 

        frame.src = "https://youtube-nocookie.com" + id;
        box.classList.add('elastic-reveal');
    }
    </script>

</body>
</html>
