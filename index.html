<!DOCTYPE html>
<html>
<head>
    <title>Video Portal</title>
</head>
<body style="background:#121212; color:#fff; text-align:center; font-family:sans-serif; padding:50px;">

    <h1>Video Gateway</h1>
    <p>Paste a YouTube URL or Video ID:</p>
    
    <input type="text" id="vid" style="padding:10px; width:50%; font-size:16px;">
    <button onclick="play()" style="padding:10px 20px; font-size:16px; background:#c00; color:#fff; border:none; cursor:pointer;">Load</button>

    <div id="box" style="display:none; margin-top:30px;">
        <iframe id="frame" width="640" height="360" allowfullscreen style="border:2px solid #333;"></iframe>
    </div>

    <script>
    function play() {
        var input = document.getElementById('vid').value.trim();
        var id = input.includes('v=') ? input.split('v=')[1].split('&')[0] : input;
        document.getElementById('frame').src = "https://youtube-nocookie.com" + id;
        document.getElementById('box').style.display = "block";
    }
    </script>

</body>
</html>
