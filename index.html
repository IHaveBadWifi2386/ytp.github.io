<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal</title>
    <style>
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes elasticReveal {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            70% { transform: scale(1.02) translateY(-2px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        body {
            background: linear-gradient(-45deg, #0f0f11, #18181b, #111115, #09090b);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            color: #fff;
            text-align: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 60px 20px;
            margin: 0;
            min-height: 100vh;
        }
        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #ffffff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { color: #71717a; margin-bottom: 30px; }
        
        /* Container for settings */
        .config-bar {
            margin-bottom: 20px;
        }
        select {
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            outline: none;
            cursor: pointer;
        }

        .search-box {
            display: flex;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        input {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
        }
        button {
            padding: 14px 32px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s, transform 0.2s;
        }
        button:hover { background: #ff1a1a; }
        button:active { transform: scale(0.95); }

        #box { display: none; max-width: 760px; margin: 40px auto 0 auto; }
        .elastic-reveal { display: block !important; animation: elasticReveal 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    </style>
</head>
<body>

    <h1>Video Gateway Pro</h1>
    <p>Bypass local firewalls using alternative proxy filters</p>
    
    <div class="config-bar">
        <label for="serverSelect">Bypass Method: </label>
        <select id="serverSelect">
            <option value="nocookie">YouTube Embed Server</option>
            <option value="piped">Piped Unblocked Proxy</option>
        </select>
    </div>

    <div class="search-box">
        <input type="text" id="vid" placeholder="Paste link or 11-digit ID...">
        <button onclick="play()">Launch Stream</button>
    </div>

    <div id="box">
        <div class="video-wrapper">
            <iframe id="frame" allowfullscreen></iframe>
        </div>
    </div>

    <script>
    function getID(url) {
        // Safe regex parser to extract video IDs without code concatenation errors
        var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        var match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : url;
    }

    function play() {
        var input = document.getElementById('vid').value.trim();
        if (!input) return;

        var videoId = getID(input);
        var serverType = document.getElementById('serverSelect').value;
        var finalUrl = "";

        if (serverType === "nocookie") {
            // Repaired trailing syntax link generation
            finalUrl = "https://www.youtube-nocookie.com/embed/" + videoId;
        } else if (serverType === "piped") {
            // Alternative open proxy instance layout to skip firewall blocks
            finalUrl = "https://piped.video" + videoId;
        }

        var box = document.getElementById('box');
        var frame = document.getElementById('frame');

        box.classList.remove('elastic-reveal');
        void box.offsetWidth; 

        frame.src = finalUrl;
        box.classList.add('elastic-reveal');
    }
    </script>

</body>
</html>
