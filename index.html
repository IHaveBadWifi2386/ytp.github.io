<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal</title>
    <style>
        /* Smooth page fade-in animation */
        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Smooth expanding reveal for the video container */
        @keyframes revealVideo {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        body {
            background: #121212;
            color: #fff;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 50px 20px;
            margin: 0;
            animation: fadeInPage 0.8s ease-out forwards;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
        }

        .search-container {
            margin-bottom: 40px;
        }

        input {
            padding: 14px 20px;
            width: 50%;
            max-width: 500px;
            font-size: 16px;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 30px;
            color: #fff;
            outline: none;
            /* Smoothly transition border color and box shadow on click */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input:focus {
            border-color: #ff3333;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        button {
            padding: 14px 28px;
            font-size: 16px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: bold;
            /* Smooth background color fade on hover */
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background: #ff3333;
        }

        button:active {
            transform: scale(0.96);
        }

        #box {
            display: none;
            margin-top: 30px;
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        /* This utility class triggers when the video opens */
        .animate-reveal {
            animation: revealVideo 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Fixed 16:9 widescreen ratio */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 2px solid #222;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <h1>Video Gateway</h1>
    <p>Paste a YouTube URL or 11-digit Video ID below:</p>
    
    <div class="search-container">
        <input type="text" id="vid" placeholder="e.g., dQw4w9WgXcQ">
        <button onclick="play()">Load Video</button>
    </div>

    <div id="box">
        <div class="video-wrapper">
            <iframe id="frame" allowfullscreen></iframe>
        </div>
    </div>

    <script>
    function play() {
        var input = document.getElementById('vid').value.trim();
        if (!input) return;

        // Clean link parser logic
        var id = input;
        if (input.includes('v=')) {
            id = input.split('v=')[1].split('&')[0];
        } else if (input.includes('youtu.be/')) {
            id = input.split('youtu.be/')[1].split('?')[0];
        }

        var box = document.getElementById('box');
        var frame = document.getElementById('frame');

        // Reset state to re-trigger the transition effect if changing videos
        box.style.display = "none";
        box.classList.remove('animate-reveal');

        // Force a layout calculation redraw to restart animation timing
        void box.offsetWidth; 

        // Update target source element
        frame.src = "https://youtube-nocookie.com" + id;
        box.style.display = "block";
        box.classList.add('animate-reveal');
    }
    </script>

</body>
</html>
