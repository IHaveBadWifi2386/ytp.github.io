<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Minimal Video Hub</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1f1f1f;
      --text-color: #f1f1f1;
      --accent-color: #ff0000;
      --accent-hover: #cc0000;
      --input-bg: #2b2b2b;
      --border-radius: 16px;
      /* Physics-based cubic-bezier curve for high-end UI fluidity */
      --bezier-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-standard: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Cinematic fluid intro for the control dashboard */
    .container {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: var(--border-radius);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      width: 100%;
      max-width: 400px;
      text-align: center;
      transform: scale(0.9) translateY(30px);
      opacity: 0;
      animation: smoothIntro 0.8s var(--bezier-smooth) forwards;
      z-index: 10;
    }

    h1 {
      font-size: 26px;
      margin-top: 0;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .input-wrapper {
      margin-bottom: 24px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 18px;
      background-color: var(--input-bg);
      border: 2px solid transparent;
      border-radius: 10px;
      color: var(--text-color);
      font-size: 15px;
      outline: none;
      transition: var(--transition-standard);
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
      background-color: #333;
    }

    button {
      width: 100%;
      padding: 16px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-standard);
    }

    button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 0, 0, 0.3);
    }

    button:active {
      transform: translateY(1px);
    }

    /* Cinematic Overlay Layer with Fluid Backdrop Transitions */
    #cinemaOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0);
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: background-color 0.6s ease, backdrop-filter 0.6s ease, opacity 0.6s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Active State styling for structural background blending */
    #cinemaOverlay.active {
      opacity: 1;
      pointer-events: auto;
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }

    /* Kinetic Zoom and Slide Layer for the Video Frame Stage Container */
    #mediaStage {
      width: 90vw;
      height: 50.625vw;
      max-width: 1280px;
      max-height: 720px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.9);
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      transform: scale(0.8) translateY(40px);
      opacity: 0;
      transition: transform 0.7s var(--bezier-smooth), opacity 0.5s ease;
    }

    #cinemaOverlay.active #mediaStage {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    #mediaStage iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      z-index: 3000;
      letter-spacing: 0.5px;
      transform: translateY(-10px);
      opacity: 0;
      transition: var(--transition-standard);
    }

    #cinemaOverlay.active .close-btn {
      transform: translateY(0);
      opacity: 1;
      transition-delay: 0.2s; /* Delayed appearance for a premium reveal feel */
    }

    .close-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4);
    }

    .fallback-panel {
      margin-top: 24px;
      color: #777;
      font-size: 13px;
      text-align: center;
      transform: translateY(10px);
      opacity: 0;
      transition: var(--transition-standard);
    }

    #cinemaOverlay.active .fallback-panel {
      transform: translateY(0);
      opacity: 1;
      transition-delay: 0.3s;
    }

    .fallback-link {
      color: #aaa;
      text-decoration: underline;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }

    .fallback-link:hover {
      color: #fff;
    }

    /* Keyframe structural matrices */
    @keyframes smoothIntro {
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Video Studio</h1>
    <div class="input-wrapper">
      <label for="ytLink">Paste YouTube URL</label>
      <input type="text" id="ytLink" placeholder="https://youtube.com...">
    </div>
    <button id="launchBtn">Launch Canvas</button>
  </div>

  <div id="cinemaOverlay">
    <button class="close-btn" id="closeBtn">✕ Close (Esc)</button>
    <div id="mediaStage"></div>
    <div class="fallback-panel">
      Screen black? Local files restrict embed channels. 
      <span class="fallback-link" id="forceExternalLink">Launch Dedicated Tab</span>
    </div>
  </div>

  <script>
    var cinemaOverlay = document.getElementById('cinemaOverlay');
    var mediaStage = document.getElementById('mediaStage');
    var launchBtn = document.getElementById('launchBtn');
    var closeBtn = document.getElementById('closeBtn');
    var forceExternalLink = document.getElementById('forceExternalLink');
    var activeVideoId = "";

    function extractYouTubeId(url) {
      var regExp = /^.*(?:(?:youtu\.be\/|v\/|vi\/|u\/\w\/|embed\/|shorts\/)|(?:(?:watch)?\?v(?:i)?=|\&v(?:i)?=))([^#\&\?]*).*/;
      var match = url.match(regExp);
      return (match && match.length === 11) ? match : null;
    }

    launchBtn.addEventListener('click', function() {
      var rawUrl = document.getElementById('ytLink').value.trim();
      var videoId = extractYouTubeId(rawUrl);

      if (!videoId) {
        alert('Could not parse video ID. Please check your URL format.');
        return;
      }

      activeVideoId = videoId;

      mediaStage.innerHTML = `
        <iframe 
          src="https://youtube-nocookie.com{videoId}?autoplay=1&loop=1&playlist=${videoId}&rel=0&showinfo=0" 
          allow="autoplay; encrypted-media" 
          allowfullscreen>
        </iframe>
      `;

      cinemaOverlay.classList.add('active');
    });

    forceExternalLink.addEventListener('click', function() {
      if (activeVideoId) {
        var externalWindow = window.open('https://youtube-nocookie.com' + activeVideoId + '?autoplay=1&loop=1&playlist=' + activeVideoId, '_blank');
        if (!externalWindow) {
          alert('Popup blocker active. Please allow popups for this dashboard tool.');
        }
      }
    });

    function closeCinemaMode() {
      cinemaOverlay.classList.remove('active');
      setTimeout(function() {
        mediaStage.innerHTML = '';
      }, 600); // Waits for the curtain slide out before resetting DOM nodes
    }

    closeBtn.addEventListener('click', closeCinemaMode);

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' || event.keyCode === 27) {
        if (cinemaOverlay.classList.contains('active')) {
          closeCinemaMode();
        }
      }
    });
  </script>

</body>
</html>
